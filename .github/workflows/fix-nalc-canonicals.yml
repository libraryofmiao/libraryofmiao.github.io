name: Fix NALC canonical URLs
on:
  push:
    paths:
      - '.github/workflows/fix-nalc-canonicals.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update canonical and Open Graph URLs
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              Path('nalc/Visit/index.html'): {
                  'https://miaolibrary.in/nalc-visits': 'https://miaolibrary.in/nalc/Visit/index.html'
              },
              Path('nalc/Visit/testimonials/index.html'): {
                  'https://miaolibrary.in/testimonials.html': 'https://miaolibrary.in/nalc/Visit/testimonials/index.html'
              },
          }

          for path, replacements in changes.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'No expected URL found in {path}')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify URLs
        run: |
          grep -n 'rel="canonical"' nalc/Visit/index.html
          grep -n 'property="og:url"' nalc/Visit/testimonials/index.html
          grep -n 'rel="canonical"' nalc/Visit/testimonials/index.html

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nalc/Visit/index.html nalc/Visit/testimonials/index.html .github/workflows/fix-nalc-canonicals.yml
          git commit -m 'Fix NALC page canonical URLs' || exit 0
          git rm .github/workflows/fix-nalc-canonicals.yml
          git commit -m 'Remove temporary canonical URL workflow'
          git push
