name: Fix Founder Career Gap
on:
  push:
    paths:
      - '.github/workflows/fix-founder-career-gap.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Insert missing 2024-2025 career card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nalc/Visit/testimonials/founder/index.html')
          s = p.read_text(encoding='utf-8')
          if 'Deputy Commissioner · New Delhi &amp; OSD to Chief Secretary' in s:
              print('Gap card already present; no change needed.')
          else:
              marker = '<div class="career-period">2025'
              card = '<article class="career-card glass"><div class="career-period">October 2024 – 2025</div><h3>Deputy Commissioner · New Delhi &amp; OSD to Chief Secretary</h3><ul><li>Served as Deputy Commissioner of New Delhi and OSD to the Chief Secretary, Government of NCT of Delhi.</li><li>Assumed the New Delhi district assignment in October 2024 following his transfer from Arunachal Pradesh.</li></ul></article>'
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit('2025 career period not found; no file change made.')
              start = s.rfind('<article class="career-card glass">', 0, pos)
              if start < 0:
                  raise SystemExit('2025 career card start not found; no file change made.')
              s = s[:start] + card + s[start:]
              p.write_text(s, encoding='utf-8')
              print('Inserted missing career card.')
          PY
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-founder-career-gap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nalc/Visit/testimonials/founder/index.html .github/workflows/fix-founder-career-gap.yml
          git diff --cached --quiet || git commit -m 'Add missing 2024-2025 founder career timeline entry'
          git push
