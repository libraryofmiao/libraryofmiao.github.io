name: Footer Fix Runner
on:
  push:
    paths:
      - '.github/workflows/fix-visit-testimonial-footers.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply footer correction
        run: bash scripts/fix-footer.sh
      - name: Commit and clean up
        run: |
          rm -f scripts/fix-footer.sh .github/workflows/fix-visit-testimonial-footers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nalc/Visit/index.html nalc/Visit/testimonials/index.html scripts/fix-footer.sh .github/workflows/fix-visit-testimonial-footers.yml
          git commit -m 'Fix NALC Visit and Testimonials footers'
          git push
