name: Fix NALC links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix broken NALC links
        run: |
          sed -i 's#href="/nalc\.html"#href="/nalc/"#g' index.html
          rm -f .github/workflows/fix-nalc-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix NALC navigation link"
            git push origin main
          fi
