name: Fix New Delhi designation
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace designation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nalc/Visit/testimonials/founder/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="career-period">October 2024 – 2025</div><h3>Deputy Commissioner · New Delhi &amp; OSD to Chief Secretary</h3>'
          new = '<div class="career-period">October 2024 – 2025</div><h3>District Magistrate · New Delhi &amp; OSD to Chief Secretary</h3>'
          if old not in s:
              raise SystemExit('Expected designation not found; no change made.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nalc/Visit/testimonials/founder/index.html
          git commit -m 'Correct New Delhi designation in founder timeline'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-new-delhi-designation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary designation fix workflow'
            git push
          fi
