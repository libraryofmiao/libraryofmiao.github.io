name: Optimize NALC testimonial images

on:
  push:
    branches: [main]

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert testimonial JPGs to WebP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp

          img_dir="nalc/Visit/testimonials/images"
          html="nalc/Visit/testimonials/index.html"
          shopt -s nullglob
          files=("$img_dir"/*.jpg)
          test "${#files[@]}" -eq 13

          for src in "${files[@]}"; do
            base="${src%.jpg}"
            cwebp -quiet -mt -q 82 "$src" -o "${base}.webp"
          done

          python3 - <<'PY'
          from pathlib import Path
          p = Path("nalc/Visit/testimonials/index.html")
          s = p.read_text(encoding="utf-8")
          for name in [
              "01_cd_mungyak", "02_suwara", "03_abha", "04_abhinav",
              "05_shrikant", "06_vishwajeet", "07_arvind", "08_beautiful_place",
              "09_panaik", "10_rahul", "11_anupom", "12_sunny", "13_viji"
          ]:
              old = f"images/{name}.jpg"
              new = f"images/{name}.webp"
              if old not in s:
                  raise SystemExit(f"Missing HTML reference: {old}")
              s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          PY

          for src in "${files[@]}"; do
            webp="${src%.jpg}.webp"
            test -s "$webp"
            test "$(stat -c%s "$webp")" -lt "$(stat -c%s "$src")"
          done

          rm -f "${files[@]}"

          git add nalc/Visit/testimonials/index.html "$img_dir"
          git rm --ignore-unmatch .github/workflows/optimize-nalc-testimonials.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Optimize NALC testimonial images" || exit 0
          git push origin main
