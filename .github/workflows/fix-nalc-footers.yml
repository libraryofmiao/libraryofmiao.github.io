name: Fix NALC Visit and Testimonials Footers
on:
  push:
    paths:
      - '.github/workflows/fix-nalc-footers.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update page-specific footers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          visit = Path('nalc/Visit/index.html')
          testimonials = Path('nalc/Visit/testimonials/index.html')

          visit_footer = '''<footer><div class="wrap"><div class="footer-links"><a href="/">Home</a><a href="../index.html">NALC Home</a><a href="../Visit/index.html">Visits</a><a href="../Visit/testimonials/index.html">Testimonials</a></div><div class="footer-meta">© 2026 New Age Learning Centre (NALC), Miao · Sub Divisional Library, Miao · Arunachal Pradesh, India</div></div></footer>'''

          testimonial_footer = '''<footer>
    <div class="container">
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="../../index.html">NALC Home</a>
        <a href="../index.html">Visits</a>
        <a href="./index.html" aria-current="page">Testimonials</a>
        <a href="../../index.html#award">PM Award</a>
        <a href="https://x.com/NalcMiao" target="_blank" rel="noopener">X / Twitter</a>
      </div>
      <p class="footer-meta">New Age Learning Centre (NALC), Miao · Sub Divisional Library · Changlang, Arunachal Pradesh, India</p>
      <p style="margin:.4rem 0 0;opacity:.65;font-size:.82rem;">© 2026 NALC Miao · Official website: miaolibrary.in</p>
    </div>
  </footer>'''

          def replace_footer(path, replacement):
              s = path.read_text(encoding='utf-8')
              a = s.lower().find('<footer')
              b = s.lower().find('</footer>')
              if a < 0 or b < 0:
                  raise SystemExit(f'Footer not found: {path}')
              s = s[:a] + replacement + s[b+len('</footer>'):]
              path.write_text(s, encoding='utf-8')

          replace_footer(visit, visit_footer)
          replace_footer(testimonials, testimonial_footer)
          print('Updated only the footer sections of both target pages.')
          PY
      - name: Verify footer links and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected = {
            'nalc/Visit/index.html': ['href="/"', 'href="../index.html"', 'href="../Visit/index.html"', 'href="../Visit/testimonials/index.html"'],
            'nalc/Visit/testimonials/index.html': ['href="/"', 'href="../../index.html"', 'href="../index.html"', 'href="./index.html"', 'href="../../index.html#award"', 'href="https://x.com/NalcMiao"']
          }
          for name, links in expected.items():
              s = Path(name).read_text(encoding='utf-8')
              footer = s[s.lower().find('<footer'):s.lower().find('</footer>')+9]
              for link in links:
                  assert link in footer, f'Missing {link} in {name}'
          print('Footer verification passed.')
          PY
          rm -f .github/workflows/inspect-nalc-footers.yml .github/workflows/fix-nalc-footers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nalc/Visit/index.html nalc/Visit/testimonials/index.html .github/workflows/inspect-nalc-footers.yml .github/workflows/fix-nalc-footers.yml
          git commit -m "Correct NALC Visit and Testimonials footers" || true
          git push
