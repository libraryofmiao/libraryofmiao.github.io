name: Add NALC alternate-name metadata
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update structured metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '"alternateName": "Sub Divisional Library Miao",'
          new = '''"alternateName": [
        "NALC Miao",
        "Sub-Divisional Library Miao",
        "SDLM Miao",
        "SDL Miao",
        "SDL"
    ],'''
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit metadata update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Add NALC Miao alternate-name metadata' && git push)
