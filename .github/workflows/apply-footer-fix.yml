name: Apply NALC Footer Corrections
on:
  push:
    paths:
      - '.github/workflows/apply-footer-fix.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardize footer sections to NALC homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          footer = '''  <footer>
    <div class="container"><div class="footer-links"><a href="/">Home</a><a href="/nalc/index.html#history">History</a><a href="/nalc/index.html#mission">Mission</a><a href="/nalc/index.html#events">Events</a><a href="/nalc/index.html#award">PM Award</a><a href="https://miaolibrary.in/">miaolibrary.in</a><a href="https://x.com/NalcMiao" target="_blank" rel="noopener">X</a></div><p class="footer-meta">New Age Learning Centre (NALC), Miao · Sub Divisional Library · Changlang, Arunachal Pradesh, India</p><p style="margin:0;opacity:.72">© NALC Miao</p></div>
  </footer>'''

          for name in ['nalc/Visit/index.html', 'nalc/Visit/testimonials/index.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              a = s.lower().find('<footer')
              b = s.lower().find('</footer>', a)
              if a < 0 or b < 0:
                  raise SystemExit(f'Footer not found in {name}')
              p.write_text(s[:a] + footer + s[b + len('</footer>'):], encoding='utf-8')
          PY
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
            '<div class="container"><div class="footer-links">',
            'href="/nalc/index.html#history"',
            'href="/nalc/index.html#mission"',
            'href="/nalc/index.html#events"',
            'href="/nalc/index.html#award"',
            'href="https://miaolibrary.in/"',
            'href="https://x.com/NalcMiao"',
            '© NALC Miao'
          ]
          for name in ['nalc/Visit/index.html', 'nalc/Visit/testimonials/index.html']:
              s = Path(name).read_text(encoding='utf-8')
              a = s.lower().find('<footer')
              b = s.lower().find('</footer>', a)
              footer = s[a:b + len('</footer>')]
              for item in required:
                  assert item in footer, f'{item} missing from {name}'
              assert 'href="#"' not in footer
              assert 'nalc.html' not in footer
          print('NALC footer standardization verified.')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nalc/Visit/index.html nalc/Visit/testimonials/index.html
          git commit -m 'Standardize NALC Visit and Testimonials footers'
          git rm .github/workflows/apply-footer-fix.yml
          git commit -m 'Remove temporary footer correction workflow'
          git push
