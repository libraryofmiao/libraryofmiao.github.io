name: Update Admin Links

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update first two Admin links only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://www.login.run.place/'
          new = 'https://nalc-login.pages.dev'
          count = s.count(old)
          if count < 2:
              raise SystemExit(f'Expected at least 2 old Admin URLs, found {count}')
          first = s.find(old)
          second = s.find(old, first + len(old))
          s = s[:first] + new + s[first + len(old):]
          second = second + len(new) - len(old)
          s = s[:second] + new + s[second + len(old):]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/update-admin-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-admin-links.yml
          git diff --cached --quiet || git commit -m "Change Admin links to nalc-login.pages.dev"
          git push
