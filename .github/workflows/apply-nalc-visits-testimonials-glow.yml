name: Apply NALC Visits Testimonials glow
on:
  push:
    paths:
      - '.github/workflows/apply-nalc-visits-testimonials-glow.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested NALC page changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nalc/index.html')
          s=p.read_text()
          old='''    .nav-glow-wrap,.footer-glow-wrap{position:relative;display:inline-flex;padding:2px;border-radius:999px;background:linear-gradient(0deg,#000,#222);overflow:hidden;isolation:isolate}\n    .nav-glow-wrap::before,.footer-glow-wrap::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0%,#0ff 25%,transparent 50%);animation:nalcVisitsTestimonialsGlow 4s linear infinite;z-index:-1}\n    @keyframes nalcVisitsTestimonialsGlow{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}\n    .nav-glow-wrap .nav-link,.footer-glow-wrap .footer-link{position:relative;display:inline-flex;align-items:center;justify-content:center;background:#fff!important;color:#232323!important;border-radius:999px;padding:6px 13px!important;font-weight:600;white-space:nowrap}\n    .nav-glow-wrap .nav-link:hover,.footer-glow-wrap .footer-link:hover{background:#fff!important;color:#232323!important}\n'''
          new='''    .nav-glow-wrap,.footer-glow-wrap{position:relative;display:inline-flex;padding:2px;border-radius:999px;background:#fff;overflow:hidden;isolation:isolate}\n    .nav-glow-wrap::before,.footer-glow-wrap::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0%,#0ff 25%,transparent 50%);animation:nalcVisitsTestimonialsGlow 4s linear infinite;z-index:0}\n    @keyframes nalcVisitsTestimonialsGlow{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}\n    .nav-glow-wrap .nav-link,.footer-glow-wrap .footer-link{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;background:#fff!important;color:#232323!important;border-radius:999px;padding:6px 13px!important;font-weight:600;white-space:nowrap}\n    .nav-glow-wrap .nav-link:hover,.footer-glow-wrap .footer-link:hover{background:#fff!important;color:#232323!important}\n'''
          if s.count(old)!=1: raise SystemExit('Existing glow CSS not found exactly once')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nalc/index.html
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'Refine NALC Visits Testimonials glow appearance'
          git push
