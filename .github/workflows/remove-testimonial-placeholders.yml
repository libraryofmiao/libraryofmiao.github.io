name: Remove testimonial image placeholders

on:
  push:
    paths:
      - '.github/workflows/remove-testimonial-placeholders.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only placeholder elements from testimonial cards
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('nalc/Visit/testimonials/index.html')
          s = p.read_text(encoding='utf-8')
          original = s
          # Remove standalone HTML elements whose class contains "placeholder".
          # This targets the testimonial page only and leaves all other content unchanged.
          pattern = re.compile(r'<(?P<tag>div|span|figure|p)(?P<attrs>[^>]*class=["\'][^"\']*placeholder[^"\']*["\'][^>]*)>.*?</(?P=tag)>', re.I | re.S)
          s = pattern.sub('', s)
          if s == original:
              print('No placeholder elements found; no change made.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Removed placeholder elements from testimonial cards only.')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nalc/Visit/testimonials/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Remove testimonial image placeholders'
            git push
          fi