name: Add favicon once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  favicon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add favicon without changing page content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<link rel="icon" type="image/webp" href="index_files/cbimage_3vTi.webp">'
          if marker not in s:
              s = s.replace('  <meta name="theme-color" content="#060c18">\n', '  <meta name="theme-color" content="#060c18">\n  ' + marker + '\n', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit favicon and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/one-time-favicon.yml
          git diff --cached --quiet || git commit -m 'Add favicon using existing library logo'
          git push
