name: Fix Founder Career Timeline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix Founder career timeline'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update career timeline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nalc/Visit/testimonials/founder/index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<article class="career-card glass"><div class="career-period">Late 2024 – Present</div><h3>Cadre Shift to Delhi / GNCTD</h3><ul><li>Transferred to the Delhi segment of the AGMUT cadre.</li><li>Appointed as District Magistrate (DM) / Deputy Commissioner (New Delhi District).</li><li>Held key concurrent administrative responsibilities, including Officer on Special Duty (OSD) to the Chief Secretary of Delhi, alongside roles across state utilities and revenue administration.</li></ul></article>'''
          new = '''<article class="career-card glass"><div class="career-period">2025 – Present</div><h3>Special Secretary · Power Department, GNCTD</h3><ul><li>Serving as Special Secretary in the Power Department, Government of NCT of Delhi.</li><li>Previously served as District Election Officer (New Delhi) during the Delhi Assembly Election 2025.</li></ul></article>'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one career block, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-founder-career.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nalc/Visit/testimonials/founder/index.html .github/workflows/fix-founder-career.yml
          git commit -m "Update Founder career timeline"
          git push
