name: Roll back testimonials to previous version
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous version
        run: |
          git checkout 4a9a20931b2394fef631db07f1811315f3da2703 -- nalc/Visit/testimonials/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nalc/Visit/testimonials/index.html
          git commit -m "Rollback incorrect testimonials theme modification"
          git push
