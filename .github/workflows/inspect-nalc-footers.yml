name: Inspect NALC Footers
on:
  push:
    paths:
      - '.github/workflows/inspect-nalc-footers.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print footer sections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('nalc/Visit/index.html'), Path('nalc/Visit/testimonials/index.html')]:
              s=p.read_text(encoding='utf-8')
              a=s.lower().find('<footer')
              b=s.lower().find('</footer>')
              print('\n===== '+str(p)+' =====')
              print(s[a:b+9] if a>=0 and b>=0 else 'FOOTER NOT FOUND')
          PY
