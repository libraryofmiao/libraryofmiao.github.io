name: Sync NALC Visit Footers

on:
  push:
    paths:
      - '.github/workflows/sync-nalc-footers.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardize Visit and Testimonials footers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          footer = '''<footer>\n    <div class="container"><div class="footer-links"><a href="/">Home</a><a href="/nalc/index.html#history">History</a><a href="/nalc/index.html#mission">Mission</a><a href="/nalc/index.html#events">Events</a><a href="/nalc/index.html#award">PM Award</a><a href="/nalc/Visit/index.html">Visit</a><a href="/nalc/Visit/testimonials/index.html">Testimonials</a><a href="https://miaolibrary.in/">miaolibrary.in</a><a href="https://x.com/NalcMiao" target="_blank" rel="noopener">X</a></div><p class="footer-meta">New Age Learning Centre (NALC), Miao · Sub Divisional Library · Changlang, Arunachal Pradesh, India</p><p style="margin:0;opacity:.72">© NALC Miao</p></div>\n  </footer>'''
          for name in ['nalc/Visit/index.html', 'nalc/Visit/testimonials/index.html']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              start = text.find('<footer>')
              end = text.find('</footer>', start)
              if start == -1 or end == -1:
                  raise SystemExit(f'Footer not found in {name}')
              text = text[:start] + footer + text[end + len('</footer>'):]
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nalc/Visit/index.html nalc/Visit/testimonials/index.html
          git diff --cached --quiet || git commit -m 'Standardize NALC Visit and Testimonials footers'
          git push
