name: Match NALC homepage theme on testimonials
'on':
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply homepage theme
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('nalc/Visit/testimonials/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<meta name="theme-color" content="#2b7a69">','<meta name="theme-color" content="#060c18">')
          s=s.replace('https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap','https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap')
          s=re.sub(r'\n  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">','',s)
          css='''  <style>
:root{--bg-deep:#060c18;--bg-mid:#0b1528;--bg-card:#0f1e38;--blue-neon:#00f0ff;--gold-light:#fbbf24;--text-main:#f1f5f9;--text-muted:#94a3b8;--font-display:"Fraunces",Georgia,serif;--font-body:"Inter",system-ui,sans-serif;--neon-glow:0 0 12px rgba(0,240,255,.65),0 0 24px rgba(0,210,255,.35);--neon-glow-subtle:0 0 8px rgba(0,240,255,.45)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:var(--font-body);background:var(--bg-deep);color:var(--text-main);line-height:1.5;overflow-x:hidden}body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 15% 10%,rgba(0,240,255,.08),transparent 28%),radial-gradient(circle at 85% 30%,rgba(56,189,248,.05),transparent 30%)}img{max-width:100%;display:block}a{color:inherit}.container{max-width:80rem;margin:0 auto;padding:0 1.5rem;width:100%}
nav.top{position:fixed;inset:0 0 auto 0;z-index:50;transition:.5s;border-bottom:1px solid transparent}nav.top.scrolled{background:rgba(6,12,24,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom-color:rgba(0,240,255,.2)}.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.5rem;max-width:80rem;margin:0 auto;width:100%}.brand{display:flex;align-items:center;gap:.75rem;text-decoration:none;min-width:0}.brand-mark{width:2.5rem;height:2.5rem;border-radius:9999px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gold-light);background:rgba(11,21,40,.8);box-shadow:0 0 12px rgba(217,119,6,.35);color:#fff;font-family:var(--font-display);font-weight:600}.brand-name{font-family:var(--font-display);font-size:.875rem;font-weight:600;color:#fff;letter-spacing:.02em;white-space:nowrap}.brand-sub{display:block;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-neon);text-shadow:var(--neon-glow-subtle)}.nav-links{display:none;align-items:center;gap:.25rem}.glass-link{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem 1rem;border-radius:9999px;font-size:.875rem;font-weight:500;letter-spacing:.02em;color:#cbd5e1;text-decoration:none;border:1px solid transparent;transition:.25s}.glass-link:hover,.glass-link.active{color:var(--blue-neon);text-shadow:var(--neon-glow-subtle);background:rgba(0,240,255,.1);border-color:rgba(0,240,255,.4);box-shadow:0 0 18px rgba(0,240,255,.3),inset 0 1px 0 rgba(255,255,255,.1)}.menu-btn{padding:.5rem;color:var(--blue-neon);background:none;border:0}.mobile-menu{display:none;flex-direction:column;gap:.5rem;padding:0 1.5rem 1.25rem;background:rgba(6,12,24,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);width:100%}.mobile-menu.open{display:flex}.glow-wrap{position:relative;display:inline-flex;padding:2px;border-radius:12px;background:linear-gradient(0deg,#000,#222);overflow:hidden;isolation:isolate}.glow-wrap::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0%,#0ff 25%,transparent 50%);animation:rotateGlow 4s linear infinite;z-index:-1}@keyframes rotateGlow{to{transform:rotate(360deg)}}.glow-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;background:#111;color:#fff;padding:.3rem .9rem;border-radius:10px;text-decoration:none;font-size:.875rem;font-weight:500;z-index:1}
.hero{position:relative;overflow:hidden;padding:8.5rem 0 5rem;background:linear-gradient(180deg,#060c18 0%,#0b1528 58%,#060c18 100%);border-bottom:1px solid rgba(0,240,255,.08)}.hero::after{content:"";position:absolute;width:32rem;height:32rem;right:-12rem;top:-12rem;border-radius:50%;border:1px solid rgba(0,240,255,.12);box-shadow:0 0 80px rgba(0,240,255,.06)}.hero .container{position:relative;z-index:1}.eyebrow,.section-kicker{display:inline-flex;align-items:center;gap:.5rem;font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-neon);text-shadow:var(--neon-glow-subtle);margin-bottom:1rem}.eyebrow i{width:.375rem;height:.375rem;border-radius:9999px;background:var(--blue-neon);box-shadow:0 0 10px var(--blue-neon)}.hero h1{font-family:var(--font-display);font-weight:300;font-size:clamp(2.7rem,7vw,5.5rem);line-height:1.05;letter-spacing:-.035em;color:#fff;margin-bottom:1rem}.hero h1 span{color:var(--blue-neon);text-shadow:var(--neon-glow)}.hero p{max-width:44rem;font-size:1.12rem;color:#cbd5e1;margin:0}
section{padding:4rem 0;background:rgba(0,0,0,.18)}.section-kicker{display:block;margin-bottom:.7rem}.section-title{font-family:var(--font-display);font-weight:300;font-size:clamp(2.1rem,4vw,3.2rem);line-height:1.15;letter-spacing:-.025em;margin-bottom:.8rem;color:#fff}.section-subtitle{color:#94a3b8;max-width:44rem;font-size:1.05rem;margin-bottom:2.5rem}.glass{background:rgba(15,30,56,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:1rem;box-shadow:0 12px 40px rgba(0,0,0,.28)}.testimonial-card{padding:2rem;margin-bottom:1.75rem;transition:.3s}.testimonial-card:hover{background:rgba(20,38,70,.7);border-color:rgba(0,240,255,.4);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 15px rgba(0,240,255,.25)}.t-date{font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-neon);text-shadow:var(--neon-glow-subtle);margin-bottom:.5rem}.t-name{font-family:var(--font-display);font-size:1.55rem;font-weight:500;color:#fff;margin-bottom:.2rem}.t-designation{font-size:.92rem;color:#94a3b8;font-style:italic;margin-bottom:1rem}.t-praise{font-size:1rem;line-height:1.7;color:#cbd5e1;margin-bottom:1.35rem;border-left:2px solid var(--blue-neon);padding-left:1rem}.t-image-wrap{background:rgba(6,12,24,.72);border-radius:.9rem;border:1px solid rgba(255,255,255,.08);padding:.75rem;overflow:hidden}.t-image-wrap img{width:100%;height:auto;border-radius:.55rem}.t-caption{font-size:.78rem;color:#94a3b8;text-align:center;margin-top:.55rem;font-style:italic}.year-divider{display:flex;align-items:center;gap:1rem;margin:2.75rem 0 1.5rem}.year-divider span{font-family:var(--font-display);font-size:1.35rem;font-weight:500;color:var(--blue-neon);text-shadow:var(--neon-glow-subtle)}.year-divider::before{content:"";width:3rem;height:2px;background:linear-gradient(90deg,var(--blue-neon),transparent);box-shadow:0 0 8px rgba(0,240,255,.6)}.year-divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(0,240,255,.35),transparent)}
footer{background:#060c18;color:rgba(255,255,255,.78);padding:3rem 0 2rem;border-top:1px solid rgba(0,240,255,.12)}.footer-links{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.25rem}.footer-links a{color:#cbd5e1;font-size:.875rem;font-weight:500;padding:.45rem .75rem;border-radius:9999px}.footer-links a:hover{color:var(--blue-neon);background:rgba(0,240,255,.08)}.footer-meta{font-size:.8rem;color:#94a3b8;margin:0}.footer-copy{margin:.4rem 0 0;color:#64748b;font-size:.78rem}
@media(min-width:768px){.nav-links{display:flex}.menu-btn,.mobile-menu{display:none!important}.testimonial-card{padding:2.1rem 2.2rem 1.7rem}}@media(max-width:767px){.nav-inner{padding:.7rem 1rem}.brand-sub{display:none}.hero{padding:7rem 0 3.5rem}.hero h1{font-size:clamp(2.4rem,12vw,3.5rem)}section{padding:3.5rem 0}.testimonial-card{padding:1.35rem}}
</style>'''
          s=re.sub(r'  <style>.*?</style>',css,s,count=1,flags=re.S)
          header='''  <header><nav class="top" id="nav"><div class="nav-inner"><a class="brand" href="https://miaolibrary.in/"><span class="brand-mark">N</span><span><span class="brand-name">Sub Divisional Library Miao</span><span class="brand-sub">New Age Learning Centre</span></span></a><div class="nav-links"><a class="glass-link" href="https://miaolibrary.in/">Home</a><a class="glass-link" href="https://miaolibrary.in/nalc.html">About NALC</a><a class="glass-link active" href="#testimonials">Testimonials</a><a class="glass-link" href="https://miaolibrary.in/nalc.html#award">PM Award</a></div><button class="menu-btn" id="menuBtn" aria-label="Toggle menu" type="button">☰</button></div><div class="mobile-menu" id="mobileMenu"><a class="glass-link" href="https://miaolibrary.in/">Home</a><a class="glass-link" href="https://miaolibrary.in/nalc.html">About NALC</a><a class="glass-link active" href="#testimonials">Testimonials</a><a class="glass-link" href="https://miaolibrary.in/nalc.html#award">PM Award</a><div class="glow-wrap"><a class="glow-btn" href="https://miaolibrary.in/nalc.html">NALC</a></div></div></nav></header>'''
          s=re.sub(r'  <header.*?</header>',header,s,count=1,flags=re.S)
          footer='''  <footer><div class="container"><div class="footer-links"><a href="https://miaolibrary.in/">Home</a><a href="https://miaolibrary.in/nalc.html">About NALC</a><a href="#testimonials">Testimonials</a><a href="https://miaolibrary.in/nalc.html#award">PM Award</a><a href="https://x.com/NalcMiao" target="_blank" rel="noopener">X / Twitter</a></div><p class="footer-meta">New Age Learning Centre (NALC), Miao · Sub Divisional Library · Changlang, Arunachal Pradesh, India</p><p class="footer-copy">© NALC Miao</p></div></footer>'''
          s=re.sub(r'  <footer>.*?</footer>',footer,s,count=1,flags=re.S)
          script='''  <script>const nav=document.getElementById("nav"),menuBtn=document.getElementById("menuBtn"),mobileMenu=document.getElementById("mobileMenu");window.addEventListener("scroll",()=>nav.classList.toggle("scrolled",window.scrollY>60),{passive:true});menuBtn.addEventListener("click",()=>mobileMenu.classList.toggle("open"));mobileMenu.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>mobileMenu.classList.remove("open")));</script>'''
          s=re.sub(r'  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>',script,s)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q -- '--bg-deep:#060c18' nalc/Visit/testimonials/index.html
          grep -q 'class="nav-links"' nalc/Visit/testimonials/index.html
          test "$(grep -o '\.webp' nalc/Visit/testimonials/index.html | wc -l)" -ge 13
      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nalc/Visit/testimonials/index.html
          git commit -m 'Match testimonials page to NALC homepage theme'
          git push
          git rm .github/workflows/theme-nalc-testimonials.yml
          git commit -m 'Remove temporary testimonials theme workflow'
          git push
