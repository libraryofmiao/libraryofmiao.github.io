name: Standardize NALC footers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  standardize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Standardize footer markup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          footers = {
              'nalc/Visit/index.html': '''  <footer>
              <div class="container"><div class="footer-links"><a href="/">Home</a><a href="/nalc/index.html#history">History</a><a href="/nalc/index.html#mission">Mission</a><a href="/nalc/index.html#events">Events</a><a href="/nalc/index.html#award">PM Award</a><a href="https://miaolibrary.in/">miaolibrary.in</a><a href="https://x.com/NalcMiao" target="_blank" rel="noopener">X</a></div><p class="footer-meta">New Age Learning Centre (NALC), Miao · Sub Divisional Library · Changlang, Arunachal Pradesh, India</p><p style="margin:0;opacity:.72">© NALC Miao</p></div>
            </footer>''',
              'nalc/Visit/testimonials/index.html': '''  <footer>
              <div class="container"><div class="footer-links"><a href="/">Home</a><a href="/nalc/index.html#history">History</a><a href="/nalc/index.html#mission">Mission</a><a href="/nalc/index.html#events">Events</a><a href="/nalc/index.html#award">PM Award</a><a href="https://miaolibrary.in/">miaolibrary.in</a><a href="https://x.com/NalcMiao" target="_blank" rel="noopener">X</a></div><p class="footer-meta">New Age Learning Centre (NALC), Miao · Sub Divisional Library · Changlang, Arunachal Pradesh, India</p><p style="margin:0;opacity:.72">© NALC Miao</p></div>
            </footer>'''
          }

          for name, footer in footers.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              start = s.lower().find('<footer')
              end = s.lower().find('</footer>', start)
              if start < 0 or end < 0:
                  raise SystemExit(f'Footer not found: {name}')
              p.write_text(s[:start] + footer + s[end + len('</footer>'):], encoding='utf-8')
          PY

      - name: Verify exact footer standardization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              'nalc/Visit/index.html': ['<div class="container"><div class="footer-links">', 'href="/nalc/index.html#history"', 'href="/nalc/index.html#mission"', 'href="/nalc/index.html#events"', 'href="/nalc/index.html#award"', 'href="https://miaolibrary.in/"', 'href="https://x.com/NalcMiao"', '© NALC Miao'],
              'nalc/Visit/testimonials/index.html': ['<div class="container"><div class="footer-links">', 'href="/nalc/index.html#history"', 'href="/nalc/index.html#mission"', 'href="/nalc/index.html#events"', 'href="/nalc/index.html#award"', 'href="https://miaolibrary.in/"', 'href="https://x.com/NalcMiao"', '© NALC Miao']
          }
          for name, checks in expected.items():
              s = Path(name).read_text(encoding='utf-8')
              footer = s[s.lower().find('<footer'):s.lower().find('</footer>') + len('</footer>')]
              for check in checks:
                  assert check in footer, f'{check} missing from {name}'
              assert 'href="#"' not in footer
              assert 'nalc.html' not in footer
          print('Footer standardization verified.')
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nalc/Visit/index.html nalc/Visit/testimonials/index.html
          git commit -m 'Standardize NALC Visit and Testimonials footers' || true
          git rm .github/workflows/standardize-nalc-footers.yml
          git commit -m 'Remove temporary footer standardization workflow'
          git push
